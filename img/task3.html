<!DOCTYPE html>
<html lang="en">
<head>
   <style>
     .parent{
        width: 1000px;
        height: 400px;
        border: 1px solid black;
        display: flex; 
        align-items: center;
        flex-direction: column-reverse;
        justify-content: space-between;
     }
     .box{
        border: 1px solid red;
        width: 300px;
        /* height: 100px; */
        font-size: 50px;
        text-align: center;
     }
   </style>
</head>
<body>
    <div class="parent">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
    </div>
</body>
</html>
